services:
  vstudio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vtuber_studio_app
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    env_file:
      - .env
    restart: unless-stopped
